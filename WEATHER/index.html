<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather App | Portfolio Project</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <div class="card">

      <header>
        <h1>Weather App</h1>
        <button id="refreshBtn">⟳</button>
      </header>

      <div class="search">
        <input type="text" id="locationInput" placeholder="Search city..." />
        <button id="searchBtn">Search</button>
      </div>

      <div id="loader" class="loader hidden"></div>

      <div id="weather" class="weather hidden"></div>

      <h3 id="outlookTitle" class="hidden">24 Hour Outlook</h3>
      <div id="hours" class="hours"></div>

      <p id="error" class="error"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
