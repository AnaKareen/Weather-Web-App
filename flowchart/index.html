<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowform</title>
<link rel="stylesheet" href="style.css">


</head>
<body>
<div class="app">
<header>
  <div class="logo">flowform<span class="logo-dot"></span></div>
  <div class="header-divider"></div>
  <div class="header-tag">constructor de diagramas</div>
  <div class="node-counter" id="counter">0 nodos</div>
</header>
<aside class="sidebar">
  <div class="sidebar-scroll">
    <div class="sec" style="margin-top:4px">Tipo de nodo</div>
    <div class="type-grid">
      <button class="type-btn active" onclick="selectType('start')" id="t-start">
        <svg class="type-icon" viewBox="0 0 44 26"><rect x="3" y="4" width="38" height="18" rx="9" fill="none" stroke="#111" stroke-width="1.5"/></svg>
        <div class="type-name">Inicio</div>
      </button>
      <button class="type-btn" onclick="selectType('process')" id="t-process">
        <svg class="type-icon" viewBox="0 0 44 26"><rect x="3" y="4" width="38" height="18" rx="3" fill="none" stroke="#1a56db" stroke-width="1.5"/></svg>
        <div class="type-name">Proceso</div>
      </button>
      <button class="type-btn" onclick="selectType('decision')" id="t-decision">
        <svg class="type-icon" viewBox="0 0 44 26"><polygon points="22,3 41,13 22,23 3,13" fill="none" stroke="#d97706" stroke-width="1.5"/></svg>
        <div class="type-name">Decisión</div>
      </button>
      <button class="type-btn" onclick="selectType('end')" id="t-end">
        <svg class="type-icon" viewBox="0 0 44 26"><rect x="3" y="4" width="38" height="18" rx="9" fill="none" stroke="#dc2626" stroke-width="1.5"/></svg>
        <div class="type-name">Fin</div>
      </button>
    </div>
    <div class="sec">Etiqueta</div>
    <div class="field">
      <input type="text" id="node-label" placeholder="Ej: Verificar credenciales" maxlength="40"/>
    </div>
    <div class="branches-box" id="branches-box">
      <div class="sec" style="margin-bottom:8px">Ramas</div>
      <div class="branch-row">
        <span class="branch-pill branch-yes">Sí</span>
        <input type="text" id="branch-yes" placeholder="Ej: Acceso permitido"/>
      </div>
      <div class="branch-row">
        <span class="branch-pill branch-no">No</span>
        <input type="text" id="branch-no" placeholder="Ej: Mostrar error"/>
      </div>
    </div>
    <div id="connect-section" style="display:none">
      <div class="sec">Viene después de</div>
      <div id="connect-tags"></div>
      <div class="hint">Marca uno o varios nodos origen</div>
      <div style="height:14px"></div>
    </div>
    <button class="btn-add" onclick="addNode()">+ Agregar nodo</button>
    <button class="btn-connect-existing" id="btn-connect-existing" onclick="toggleConnectExisting()">→ Conectar a existente</button>
    <div id="connect-existing-panel" style="display:none">
      <div class="connect-existing-panel-inner">
        <div class="sec">¿A cuál nodo va la flecha?</div>
        <div id="connect-existing-targets"></div>
        <div class="hint">Solo crea la flecha, sin nodo nuevo</div>
        <div class="panel-actions">
          <button class="btn-confirm" onclick="confirmConnectExisting()">✓ Crear flecha</button>
          <button class="btn-cancel" onclick="cancelConnectExisting()">Cancelar</button>
        </div>
      </div>
    </div>
    <div style="height:16px"></div>
  </div>
  <div class="node-list">
    <div class="node-list-label">Nodos</div>
    <div id="node-list-items"><div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3)">Ninguno aún</div></div>
  </div>
  <div class="actions-bar">
    <button class="btn-clear" onclick="clearAll()">Limpiar</button>
    <button class="btn-export" onclick="exportSVG()">↓ SVG</button>
  </div>
</aside>
<main class="canvas-area" id="canvas">
  <div class="empty-state">
    <div class="empty-icon">◇</div>
    <div class="empty-title">Sin diagrama aún</div>
    <div class="empty-sub">Agrega tu primer nodo desde el panel izquierdo</div>
  </div>
</main>
</div>
<script src="script.js"></script>
</body>
</html>
